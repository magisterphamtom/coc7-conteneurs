name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour module.json
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          jq --arg v "$VERSION" --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" '.version=$v | .download=$d' module.json > tmp.json && mv tmp.json module.json
      - name: Zipper
        run: zip -r module.zip module.json scripts styles README.md LICENSE
      - name: Joindre à la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
